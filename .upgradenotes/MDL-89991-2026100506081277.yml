issueNumber: MDL-89991
notes:
  core:
    - message: >-
        `userdate()` now supports the Moodle-specific `%{time12}` and
        `%{time12seconds}` format tokens. These display localised labels at
        exactly noon and midnight, with midnight identified as the start of the
        displayed day. At other times they are equivalent to `%I:%M %p` and
        `%I:%M:%S %p`, respectively.


        The default English 12-hour formats in `langconfig` now use these
        tokens.
      type: improved
